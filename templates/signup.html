{% extends "index.html" %}
{% block body %}
<!-- Signup Form -->
<div class="login" id="signup-form">
    <h1>Sign Up</h1>
    <form method="post" action="{{ url_for('signup') }}">
        <!-- Username -->
        <label for="username">Username*</label><br>
        <input type="text" id="username" name="username" maxlength="32" placeholder="Enter Username"><br>
        <p class="guidelines">Maximum 32 characters. No spaces allowed.</p>
        <!-- Password -->
        <label for="password">Password*</label><br>
        <input type="password" id="password" name="password" placeholder="Enter Password"><br>
        <p class="guidelines">Minimum 8 characters. No spaces allowed.</p>
        <!-- Error Message -->
        {% if error %}
        <p class="error-text" style="text-align: center;">{{ error }}</p>
        {% endif %}
        <!-- Login Page Link -->
        <a href="{{ url_for('login')}}" style="font-size: 16px;">Login</a><br>
        <!-- Submit Button -->
        <input type="submit" value="Submit">
    </form>
</div>
{% endblock  %}
