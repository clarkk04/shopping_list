{% extends "index.html" %}
{% block body %}
<h2>List</h2>
<form method="post">
<table border="1">
    <tr align="center">
        <th>Item Name</th>
        <th>Quantity</th>
        <th>Catergorisation</th>
        <th>tick</th>
        <th></th>
    </tr>
    {% for item in list %}
    <tr>
        <td>{{item[5]}}</td>
        <td>{{item[2]}}</td>
        <td>{{item[6]}}
        </td>
        <td><input type="checkbox"></td>
        <td><input type="button" value="edit"></td>
    </tr>
    {% endfor %}
    <tr align="center">
        <td>
            <input list="food">
            <datalist id="food">
                <option value="apple">
            <option value="pineapple">
        </td>
        <td><input type="number"></td>
        <td>
            <input list="food-type">
            <datalist id="food-type">
            <option value="fruit">
            <option value="dairy">
        </td>
        <td><input type="checkbox"></td>
        <td><input type="button" value="edit"></td>
    </tr>
</table>
<input type="submit" value="save">
</form>
{% endblock  %}
